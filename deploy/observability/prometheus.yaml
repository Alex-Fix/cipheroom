# Metrics: pushed by the collector over OTLP (the api's), scraped from the exporters (host and containers).
# Retention (7 days, 5 GB) is set on the command line in docker-compose.yml.
global:
  scrape_interval: 30s

otlp:
  # service.name etc. become labels, so dashboards can tell the api apart from anything added later.
  promote_resource_attributes: [service.name, service.version]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
