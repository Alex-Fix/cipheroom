# Traces: single-process Tempo on local disk, 7-day retention. Receives sampled traces over OTLP from the collector.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Tempo 3 replaced the compactor with a backend scheduler and worker (both run in this single process); retention is
# the worker's job. The scheduler keeps its own copy of the setting.
backend_worker:
  compaction:
    block_retention: 168h

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
