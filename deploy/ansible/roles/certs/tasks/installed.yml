- name: Hand the certificate to edge
  ansible.builtin.command: /usr/local/sbin/cipheroom-cert-deploy
  register: certs_deployed
  changed_when: "'installed' in certs_deployed.stdout"

- name: Renewal timer enabled
  ansible.builtin.systemd_service:
    name: cipheroom-cert-renew.timer
    enabled: true
    state: started

# Renewal keeps days (IP: about 3) to spare; under two means renewals are failing.
- name: Certificate valid for at least two more days
  ansible.builtin.command: openssl x509 -in {{ certs_tls_dir }}/fullchain.pem -noout -checkend 172800
  register: certs_checkend
  changed_when: false
  failed_when: false

- name: Warn about a certificate close to expiry
  ansible.builtin.debug:
    msg: >-
      WARNING: the edge certificate expires within 48 hours — renewals are failing. On the server:
      systemctl status cipheroom-cert-renew; journalctl -u cipheroom-cert-renew
  when: certs_checkend.rc != 0
