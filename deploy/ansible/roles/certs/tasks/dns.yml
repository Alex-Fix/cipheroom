# Let's Encrypt for LiveKit's TURN over TLS, through the DNS check (certbot's Cloudflare plugin): port 80 stays closed.
# The token may only edit DNS in the zone. Renewed nightly; LiveKit restarts only when the certificate changed.
- name: Credentials directory
  ansible.builtin.file:
    path: /etc/cipheroom
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Cloudflare DNS token for certbot
  ansible.builtin.copy:
    dest: /etc/cipheroom/cloudflare-dns.ini
    content: "dns_cloudflare_api_token = {{ certs_dns_token }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Issue the certificate (once; renewals run on the timer)
  ansible.builtin.command: >-
    docker run --rm
    -v /etc/letsencrypt:/etc/letsencrypt
    -v /etc/cipheroom/cloudflare-dns.ini:/cloudflare-dns.ini:ro
    {{ certs_certbot_image }} certonly --non-interactive --agree-tos --register-unsafely-without-email
    --dns-cloudflare --dns-cloudflare-credentials /cloudflare-dns.ini --dns-cloudflare-propagation-seconds 30
    -d {{ certs_domain }}
  args:
    creates: /etc/letsencrypt/live/{{ certs_domain }}/fullchain.pem

- name: Renewal script
  ansible.builtin.template:
    src: cipheroom-cert-renew.sh.j2
    dest: /usr/local/sbin/cipheroom-cert-renew
    owner: root
    group: root
    mode: "0755"

- name: Renewal service
  ansible.builtin.copy:
    dest: /etc/systemd/system/cipheroom-cert-renew.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Renew the TURN certificate (Let's Encrypt) and restart LiveKit when it changed
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/cipheroom-cert-renew
  notify: Reload systemd

- name: Renewal timer (nightly, in the quiet window)
  ansible.builtin.copy:
    dest: /etc/systemd/system/cipheroom-cert-renew.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Nightly TURN certificate renewal

      [Timer]
      OnCalendar=*-*-* {{ certs_renew_time }}:00 UTC
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Renewal timer enabled
  ansible.builtin.systemd_service:
    name: cipheroom-cert-renew.timer
    enabled: true
    state: started
