# The Cloudflare token may only edit DNS in the zone; it stays in this root-only file (not in the stack's .env).
- name: Cloudflare DNS token for certbot
  ansible.builtin.copy:
    dest: /etc/cipheroom/cloudflare-dns.ini
    content: "dns_cloudflare_api_token = {{ certs_dns_token }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Issue the certificate (once; renewals run on the timer)
  ansible.builtin.command: >-
    {{ certs_compose_run }} -v /etc/letsencrypt:/etc/letsencrypt -v /etc/cipheroom/cloudflare-dns.ini:/cloudflare-dns.ini:ro
    certbot-dns certonly --non-interactive --agree-tos --register-unsafely-without-email
    --dns-cloudflare --dns-cloudflare-credentials /cloudflare-dns.ini --dns-cloudflare-propagation-seconds 30
    -d {{ certs_domain }}
  args:
    creates: /etc/letsencrypt/live/{{ certs_domain }}/fullchain.pem
