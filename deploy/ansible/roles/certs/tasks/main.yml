# Let's Encrypt certificates, one of two ways:
# - dns (tunnel + LiveKit with LIVEKIT_TURN_DOMAIN): a name for LiveKit's TURN over TLS, via the DNS check
# - ip (INGRESS_MODE=direct): the server's IPv4 for the edge proxy (site and TURN over TLS), via the HTTP check
- name: Certificate by DNS check
  ansible.builtin.include_tasks: dns.yml
  when: certs_mode == 'dns'

- name: Certificate for the IP address
  ansible.builtin.include_tasks: ip.yml
  when: certs_mode == 'ip'
