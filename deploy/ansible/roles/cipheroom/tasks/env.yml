# ── Environment: deploy/.env with deploy/.env.hetzner's keys on top, read on this machine ───────────────────────────
# Values never appear in output (no_log); only booleans about them do.
- name: Read deploy/.env (+ deploy/.env.hetzner)
  ansible.builtin.set_fact:
    cipheroom_env: >-
      {{ cipheroom_env | default({}) | combine({item.split('=', 1)[0]: item.split('=', 1)[1]}) }}
  loop: >-
    {{ (lookup('ansible.builtin.file', cipheroom_env_file).splitlines()
        + (lookup('ansible.builtin.file', cipheroom_env_overlay).splitlines()
           if cipheroom_env_overlay is file else []))
       | select('match', '^[A-Za-z_][A-Za-z0-9_]*=') | list }}
  no_log: true

- name: Media and ingress mode
  ansible.builtin.set_fact:
    cipheroom_media_mode: "{{ cipheroom_env.MEDIA_MODE | default('cloudflare', true) }}"
    cipheroom_ingress_mode: "{{ cipheroom_env.INGRESS_MODE | default('tunnel', true) }}"
    cipheroom_turn_domain: "{{ cipheroom_env.LIVEKIT_TURN_DOMAIN | default('') }}"

# Direct: the site's address is the server's IPv4 (a Primary IP, see Terraform), whatever PUBLIC_HOST says.
- name: Public address in direct mode
  ansible.builtin.set_fact:
    cipheroom_env: "{{ cipheroom_env | combine({'PUBLIC_HOST': ansible_host}) }}"
  when: cipheroom_ingress_mode == 'direct'
  no_log: true

- name: Server-side settings
  ansible.builtin.set_fact:
    cipheroom_env: >-
      {{ cipheroom_env | combine({
           'CIPHEROOM_TAG': cipheroom_tag,
           'CIPHEROOM_IMAGE_PREFIX': cipheroom_image_prefix,
           'OTEL_EXPORTER_OTLP_ENDPOINT': 'http://otel-collector:4317' if cipheroom_observability else '',
           'MEDIA_MODE': cipheroom_media_mode,
           'API_ALLOWED_HOSTS': (cipheroom_env.PUBLIC_HOST | default('')) ~ ';localhost'})
         | combine({'LIVEKIT_NODE_IP': ansible_host,
                    'LIVEKIT_CERTS_DIR': '/etc/letsencrypt' if cipheroom_turn_domain else ''}
                   if cipheroom_media_mode == 'livekit' else {})
         | combine({'EDGE_TLS_DIR': certs_tls_dir, 'EDGE_ACME_DIR': certs_acme_dir,
                    'NODE_EXPORTER_TEXTFILE_DIR': certs_textfile_dir,
                    'LIVEKIT_TURN_TLS_PUBLISH': '127.0.0.1:7443'}
                   if cipheroom_ingress_mode == 'direct' else {})
         | combine({'HETZNER_SERVER_ID': hcloud_server_id | string}
                   if hcloud_server_id is defined and (cipheroom_env.HCLOUD_READ_TOKEN | default('')) != '' else {}) }}
    cipheroom_env_check:
      mode: "{{ cipheroom_media_mode in ['cloudflare', 'livekit'] }}"
      ingress: >-
        {{ cipheroom_ingress_mode == 'tunnel'
           or (cipheroom_ingress_mode == 'direct' and cipheroom_media_mode == 'livekit' and cipheroom_turn_domain == '') }}
      livekit: "{{ (cipheroom_env.LIVEKIT_API_KEY | default('')) != '' and (cipheroom_env.LIVEKIT_API_SECRET | default('')) | length >= 32 }}"
      turn: "{{ cipheroom_turn_domain == '' or (cipheroom_turn_domain is match('^[A-Za-z0-9.-]+$') and (cipheroom_env.CF_DNS_API_TOKEN | default('')) != '') }}"
      overlay: "{{ cipheroom_env_overlay is file }}"
      sfu: "{{ (cipheroom_env.CF_SFU_APP_ID | default('')) != '' and (cipheroom_env.CF_SFU_APP_SECRET | default('')) != '' }}"
      tunnel: "{{ cipheroom_ingress_mode == 'direct' or (cipheroom_env.TUNNEL_TOKEN | default('')) != '' }}"
      host: "{{ (cipheroom_env.PUBLIC_HOST | default('')) is match('^[A-Za-z0-9.-]+$') }}"
      grafana: "{{ (cipheroom_env.GRAFANA_ADMIN_PASSWORD | default('')) | length >= 12 }}"
  no_log: true
