# ── Environment: deploy/.env with deploy/.env.hetzner's keys on top, read on this machine ───────────────────────────
# Values never appear in output (no_log); only booleans about them do.
- name: Read deploy/.env (+ deploy/.env.hetzner)
  ansible.builtin.set_fact:
    cipheroom_env: >-
      {{ cipheroom_env | default({}) | combine({item.split('=', 1)[0]: item.split('=', 1)[1]}) }}
  loop: >-
    {{ (lookup('ansible.builtin.file', cipheroom_env_file).splitlines()
        + (lookup('ansible.builtin.file', cipheroom_env_overlay).splitlines()
           if cipheroom_env_overlay is file else []))
       | select('match', '^[A-Za-z_][A-Za-z0-9_]*=') | list }}
  no_log: true

- name: Server-side settings
  ansible.builtin.set_fact:
    cipheroom_env: >-
      {{ cipheroom_env | combine({
           'CIPHEROOM_TAG': cipheroom_tag,
           'CIPHEROOM_IMAGE_PREFIX': cipheroom_image_prefix,
           'OTEL_EXPORTER_OTLP_ENDPOINT': 'http://otel-collector:4317' if cipheroom_observability else ''}) }}
    cipheroom_env_check:
      overlay: "{{ cipheroom_env_overlay is file }}"
      sfu: "{{ (cipheroom_env.CF_SFU_APP_ID | default('')) != '' and (cipheroom_env.CF_SFU_APP_SECRET | default('')) != '' }}"
      tunnel: "{{ (cipheroom_env.TUNNEL_TOKEN | default('')) != '' }}"
      grafana: "{{ (cipheroom_env.GRAFANA_ADMIN_PASSWORD | default('')) | length >= 12 }}"
  no_log: true
