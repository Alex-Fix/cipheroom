# Used by scripts/deploy.sh, which runs from this directory.
[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml

[ssh_connection]
pipelining = True
# Host keys pinned by scripts/provision.sh right after the server was created.
ssh_args = -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
