# The media provider comes from MEDIA_MODE in deploy/.env(.hetzner): cloudflare (Cloudflare Realtime SFU and TURN) or
# livekit (LiveKit on this server's public IP; TURN over TLS when LIVEKIT_TURN_DOMAIN is set). The website goes through
# the Cloudflare tunnel, or with INGRESS_MODE=direct (LiveKit only) straight to the server's IP: the edge proxy, with a
# Let's Encrypt certificate for that IP.

# Image tag in GHCR (sha-<commit>, main, or a release tag); scripts/deploy.sh sets it.
cipheroom_tag: ""
cipheroom_image_prefix: ghcr.io/alex-fix/cipheroom
# Telemetry stack (Grafana at /grafana/, needs GRAFANA_ADMIN_PASSWORD); scripts/deploy.sh --no-observability turns it off.
cipheroom_observability: true
cipheroom_dir: /opt/cipheroom

# Secrets come from the operator's machine: deploy/.env, then the server's overlay (optional) overrides keys in it —
# typically TUNNEL_TOKEN and PUBLIC_HOST, so the server gets its own tunnel. scripts/deploy.sh --server <name> passes
# deploy/.env.hetzner.<name> instead.
cipheroom_env_file: "{{ playbook_dir }}/../.env"
cipheroom_env_overlay: "{{ playbook_dir }}/../.env.hetzner"

# Security updates install unattended; the server reboots at this time (UTC) when one needs it. Containers come back
# by themselves and people in a call rejoin.
base_reboot_time: "04:30"
base_swap_mb: 2048 # 0 = no swap file

# Let's Encrypt for the edge proxy: certbot runs as the compose services `certbot` / `certbot-dns` (profile certs, so
# Dependabot keeps their images current). A TURN domain renews nightly at this time (UTC), an IP certificate every 12 h.
certs_compose_run: >-
  docker compose --project-directory {{ cipheroom_dir }} -f {{ cipheroom_dir }}/docker-compose.yml --profile certs
  run --rm --no-deps
certs_renew_time: "04:30"
# Direct mode: the edge proxy's certificate, the HTTP check's files, and the expiry for node-exporter's textfile collector.
certs_tls_dir: /etc/cipheroom/tls
certs_acme_dir: /var/lib/cipheroom/acme
certs_textfile_dir: /var/lib/cipheroom/textfile
