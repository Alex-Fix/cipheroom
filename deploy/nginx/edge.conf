# Edge proxy for INGRESS_MODE=direct (compose service `edge`, profile direct): the whole nginx.conf, because the
# 443 split needs a top-level `stream` block. Design: docs/plans/2026-10-14-direct-ingress-design.md
#
#   :443 ─ ssl_preread ─┬─ ALPN offered (browsers' HTTPS: h2, http/1.1) ─▶ TLS ─▶ web:8080 (app, /api, /hubs)
#                       └─ no ALPN (WebRTC's TURN over TLS)             ─▶ TLS ─▶ livekit:5349 (plain TCP TURN)
#   :80  ─ ACME HTTP check (/.well-known/acme-challenge/), everything else redirected to HTTPS
#
# One certificate for both: Let's Encrypt's short-lived IP certificate, copied to /tls by the renewal hook (a
# self-signed placeholder until the first one is issued). Ports inside are unprivileged (8080 → 80, 8443 → 443).
# Nothing here sees media, chat or keys: TURN carries SRTP with our frame encryption inside.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

stream {
  # Browsers always offer ALPN for HTTPS; libwebrtc's TURN client offers none.
  map $ssl_preread_alpn_protocols $edge_target {
    ""      unix:/tmp/edge-turn.sock;
    default unix:/tmp/edge-https.sock;
  }

  # Without Cloudflare in front, one address must not be able to hold thousands of sockets.
  limit_conn_zone $binary_remote_addr zone=edge_conn:10m;

  server {
    listen 8443;
    ssl_preread on;
    limit_conn edge_conn 64;
    preread_timeout 10s;
    proxy_connect_timeout 5s;
    # The visitor's address travels on to the TLS listeners below.
    proxy_protocol on;
    proxy_pass $edge_target;
  }

  # TURN over TLS: TLS ends here, LiveKit's TURN listens for plain TCP (turn.external_tls in livekit.yaml).
  server {
    listen unix:/tmp/edge-turn.sock ssl proxy_protocol;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:turn_tls:1m;
    ssl_session_tickets off;
    ssl_handshake_timeout 10s;
    # Resolved per connection (Docker DNS), so edge starts and reloads while LiveKit restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $turn livekit:5349;
    proxy_pass $turn;
    proxy_connect_timeout 5s;
    # TURN allocations refresh every few minutes; an idle relayed call must not be cut.
    proxy_timeout 1h;
  }
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_max_body_size 1m;

  # The visitor's real address, from the PROXY header of the split above.
  set_real_ip_from unix:;
  real_ip_header proxy_protocol;

  limit_req_zone $binary_remote_addr zone=edge_api:10m rate=10r/s;
  # Generous enough for SignalR's long-polling fallback (a request every few seconds per tab, several tabs per address).
  limit_req_zone $binary_remote_addr zone=edge_hub:10m rate=5r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen unix:/tmp/edge-https.sock ssl proxy_protocol;
    http2 on;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    # Mozilla "intermediate".
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:https_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $web http://web:8080;

    # Headers the web nginx and the api read, always set here (never passed through from the visitor). The web
    # nginx keys its Grafana login limit on CF-Connecting-IP, which cloudflared sets in tunnel mode. All of them at
    # this level and none in a location: one proxy_set_header in a location drops every inherited one (Host included,
    # which the api's AllowedHosts then rejects). Upgrade/Connection pass WebSockets (SignalR) through.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;

    # SignalR: the negotiate request and the WebSocket upgrade are limited; frames on an open socket are not.
    location /hubs/ {
      limit_req zone=edge_hub burst=50 nodelay;
      proxy_pass $web;
      proxy_read_timeout 1h;
    }

    location /api/ {
      limit_req zone=edge_api burst=40 nodelay;
      proxy_pass $web;
    }

    location / {
      proxy_pass $web;
    }
  }

  server {
    listen 8080 default_server;

    location /.well-known/acme-challenge/ {
      root /acme-webroot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }
}
