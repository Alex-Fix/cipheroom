# Single public hostname: Angular app and API (/api, /hubs) behind one origin. Media doesn't pass through here: browsers
# connect to Cloudflare Realtime SFU directly (negotiated over /hubs).
# One first-level subdomain keeps us on Cloudflare's free Universal SSL certificate.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# cloudflared sends X-Forwarded-Proto: https; keep it (fall back to our own scheme for direct LAN access).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Grafana's login is internet-facing: rate-limit it per visitor. cloudflared passes the visitor's address in
# CF-Connecting-IP (requests only reach nginx through the tunnel; direct LAN access falls back to the peer address).
map $http_cf_connecting_ip $grafana_client {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}
limit_req_zone $grafana_client zone=grafana_login:1m rate=6r/m;

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Server-level: an add_header inside a location drops all of these (only /grafana/ does that, on purpose).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Grafana (compose profile `observability`), protected by its own login (hardened in docker-compose.yml).
  # The upstream is resolved per request (Docker DNS), so nginx starts without Grafana: then this answers 502.
  # Its own header set, because any add_header here drops the server-level ones — and the app's strict CSP would
  # break Grafana, which sends its own (GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE in docker-compose.yml).
  location /grafana/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Grafana itself sends X-Content-Type-Options and its CSP.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), display-capture=()" always;
  }

  # Login page and login POST: at most 6 a minute per visitor (plus Grafana's own lockout after 5 failures).
  location = /grafana/login {
    limit_req zone=grafana_login burst=5 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Grafana itself sends X-Content-Type-Options and its CSP.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), display-capture=()" always;
  }

  # Unauthenticated, and only good for fingerprinting (it reveals Grafana's version).
  location = /grafana/api/health {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;
  }

  location = /index.html {
    expires -1;
  }

  # Fixed (unhashed) names: theme stylesheets linked from index.html, and /favicon.ico which browsers also
  # request directly — always revalidate.
  location ~ ^/(theme-(light|dark)\.css|favicon\.ico)$ {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
