# Single public hostname: Angular app, API (/api, /hubs) and LiveKit signaling (/livekit) behind one origin.
# One first-level subdomain keeps us on Cloudflare's free Universal SSL certificate.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Server-level only: an add_header inside a location would drop all of these.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # LiveKit signaling. livekit-client appends /rtc, /rtc/v1, /rtc/validate to LIVEKIT_URL's path;
  # the trailing slash on proxy_pass strips the /livekit prefix.
  location /livekit/ {
    proxy_pass http://livekit:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
