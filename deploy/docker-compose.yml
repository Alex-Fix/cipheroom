name: cipheroom

# Every service drops all Linux capabilities and can't gain privileges (setuid binaries, file capabilities): none needs
# them — ports above 1024, or Docker's unprivileged-port default for LiveKit's 443. cadvisor is the exception (privileged).
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# api and web: built locally by scripts/up.sh (tag `local`), or pulled prebuilt from GHCR on a server
# (scripts/deploy.sh sets CIPHEROOM_TAG; images published by .github/workflows/images.yml).
services:
  api:
    <<: *hardening
    image: ${CIPHEROOM_IMAGE_PREFIX:-ghcr.io/alex-fix/cipheroom}-api:${CIPHEROOM_TAG:-local}
    build:
      context: ..
      dockerfile: src/Cipheroom.Api/Dockerfile
    environment:
      Turn__Cloudflare__KeyId: ${CF_TURN_KEY_ID:-}
      Turn__Cloudflare__ApiToken: ${CF_TURN_API_TOKEN:-}
      Turn__CredentialTtlSeconds: ${TURN_CREDENTIAL_TTL_SECONDS:-14400}
      Turn__ForceRelay: ${TURN_FORCE_RELAY:-false}
      # Media provider, one per deployment: cloudflare (Cloudflare Realtime SFU + TURN) or livekit (the livekit
      # service below, profile livekit). scripts/up.sh checks the settings the chosen mode needs.
      Media__Provider: ${MEDIA_MODE:-cloudflare}
      Sfu__Cloudflare__AppId: ${CF_SFU_APP_ID:-}
      Sfu__Cloudflare__AppSecret: ${CF_SFU_APP_SECRET:-}
      # LiveKit runs in the host's network (see the livekit service); its API listens on the `livekit` bridge's gateway.
      LiveKit__Url: http://172.30.0.1:7880
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:-}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:-}
      # Trust X-Forwarded-* from our proxies only (cloudflared → nginx → api). The api publishes no ports, so only
      # containers on the compose network (Docker's 172.16.0.0/12 range) can reach it.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      # Host header allowlist ("host1;host2"). Ansible sets PUBLIC_HOST;localhost on a server; home keeps * so LAN
      # access by IP address works.
      AllowedHosts: ${API_ALLOWED_HOSTS:-*}
      # Telemetry: exported only when scripts/up.sh --observability sets the endpoint (otherwise console logs only).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: "30000"
      Telemetry__Secret: ${TELEMETRY_SECRET:-}
      # Free-tier usage from Cloudflare's analytics (read-only token); without them dashboards estimate it.
      RealtimeUsage__Cloudflare__AccountId: ${CF_ACCOUNT_ID:-}
      RealtimeUsage__Cloudflare__ApiToken: ${CF_ANALYTICS_API_TOKEN:-}
      # LiveKit mode on Hetzner: the server's own traffic (read-only token) counts instead; Ansible fills these in.
      RealtimeUsage__Hetzner__ServerId: ${HETZNER_SERVER_ID:-}
      RealtimeUsage__Hetzner__ApiToken: ${HCLOUD_READ_TOKEN:-}
      # Usage guard (docs/plans/2026-10-09-usage-guard-design.md): keeps Cloudflare Realtime inside the free tier.
      RealtimeUsage__FreeTierGb: ${REALTIME_FREE_TIER_GB:-1000}
      UsageGuard__Enabled: ${REALTIME_GUARD_ENABLED:-true}
      UsageGuard__SavingPercent: ${REALTIME_SAVING_PERCENT:-80}
      UsageGuard__AudioOnlyPercent: ${REALTIME_AUDIO_ONLY_PERCENT:-95}
      UsageGuard__PausedPercent: ${REALTIME_PAUSED_PERCENT:-99}
    volumes:
      # The guard's month-to-date estimate survives restarts (numbers and timestamps only).
      - api-data:/data
    networks: [default, otlp, livekit]
    restart: unless-stopped

  web:
    <<: *hardening
    image: ${CIPHEROOM_IMAGE_PREFIX:-ghcr.io/alex-fix/cipheroom}-web:${CIPHEROOM_TAG:-local}
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        SOURCE_URL: ${SOURCE_URL:-https://github.com/Alex-Fix/cipheroom}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
        # nginx resolves `api` once at start: when the api container is recreated (new address) without web, web would
        # keep proxying /api and /hubs to whatever now holds the old address. Restart web with it.
        restart: true
    networks: [default, grafana]
    restart: unless-stopped

  # MEDIA_MODE=livekit (profile livekit): a self-hosted SFU on this machine's public IP. It runs in the host's network,
  # as LiveKit recommends: its built-in TURN relays to its own ICE port at the public IP, and through Docker's port
  # mapping those packets never came back (forced-relay calls failed). Its ports are therefore the host's:
  #   public (opened by Terraform and ufw): 7881/tcp, 7882/udp media; 3478/udp, 30000-30100/udp TURN
  #   internal: 7880 signaling/API — bound to loopback and the `livekit` bridge's gateway only (browsers reach it through
  #     the api's relay); 5349 plain TCP TURN behind edge, which terminates TURN over TLS on 443 — every interface,
  #     kept off the internet by the Hetzner firewall and ufw (allowed from the `livekit` bridge only)
  # It runs as uid 10002 with no capabilities (no port below 1024, no certificate to read), and ufw rejects new
  # connections from that uid to Docker's private ranges, so it can't reach the internal services the host can
  # (SA-2026-10-14-02).
  livekit:
    <<: *hardening
    user: "10002:10002"
    image: livekit/livekit-server:v1.13.10
    network_mode: host
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}", "--bind", "127.0.0.1", "--bind", "172.30.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      # scripts/up.sh --direct uses a generated copy with TURN behind the edge proxy (deploy/edge/livekit.yaml).
      - ${LIVEKIT_CONFIG:-./livekit/livekit.yaml}:/etc/livekit.yaml:ro
    restart: unless-stopped
    profiles: [livekit]

  # Profile edge: TLS on 443 for LiveKit's TURN over TLS (LIVEKIT_TURN_DOMAIN) and, with INGRESS_MODE=direct, for the
  # site itself on this machine's public IP (Let's Encrypt IP certificate, no Cloudflare): split by ALPN; 80 answers
  # the certificate check and redirects. Design: docs/plans/2026-10-14-direct-ingress-design.md
  edge:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    volumes:
      - ./nginx/edge.conf:/etc/nginx/nginx.conf:ro
      # Certificate (fullchain.pem, privkey.pem) and the ACME check's files: on a server Ansible's directories.
      - ${EDGE_TLS_DIR:-./edge/tls}:/tls:ro
      - ${EDGE_ACME_DIR:-./edge/acme}:/acme-webroot:ro
    ports:
      - "80:8080"
      - "443:8443"
    depends_on: [web]
    networks: [default, livekit]
    restart: unless-stopped
    profiles: [edge]

  # Let's Encrypt (profile certs, one-off `docker compose run`): the HTTP check for IP certificates (certbot) and the
  # Cloudflare DNS check for a TURN domain (certbot-dns). Declared here so Dependabot keeps them current; the callers
  # (Ansible's certs role, scripts/ip-cert.sh) mount the directories they need.
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    network_mode: bridge
    profiles: [certs]

  certbot-dns:
    image: certbot/dns-cloudflare:v5.8.0@sha256:c45edb002b883da1a1235abb205dff474a7a1a459d878e8d5fdc7f9d83073aea
    network_mode: bridge
    profiles: [certs]

  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped
    profiles: [tunnel]

  # ── Observability (profile `observability`, scripts/up.sh --observability) ─────────────────────────────────────────
  # Self-hosted, nothing published: Grafana is reached through web (nginx) at /grafana/, protected by its own login
  # (hardened below; nginx rate-limits the login page).
  # Design: docs/plans/2026-10-07-observability-design.md

  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m
    networks: [otlp, telemetry]
    restart: unless-stopped
    profiles: [observability]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    networks: [telemetry]
    restart: unless-stopped
    profiles: [observability]

  loki:
    <<: *hardening
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 256m
    networks: [telemetry]
    restart: unless-stopped
    profiles: [observability]

  tempo:
    <<: *hardening
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 256m
    networks: [telemetry]
    restart: unless-stopped
    profiles: [observability]

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4
    environment:
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      # scripts/up.sh --observability refuses to start without it (Grafana's default would be "admin").
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Grafana sets its own CSP for /grafana/ (it needs inline scripts); no third-party origins.
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;object-src 'none';font-src 'self';
        style-src 'self' 'unsafe-inline' blob:;img-src 'self' data: blob:;base-uri 'self';
        connect-src 'self' wss://$$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';frame-ancestors 'none'
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Internet-facing behind its own login only: lock accounts after failed logins, strong passwords for any user
      # added later, sessions that expire, and no unauthenticated /metrics.
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_SECURITY_BRUTE_FORCE_LOGIN_PROTECTION_MAX_ATTEMPTS: "5"
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 7d
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 30d
      GF_METRICS_ENABLED: "false"
      # No phoning home: usage stats, update checks, news, external snapshots, plugin catalog.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    networks: [grafana, telemetry]
    restart: unless-stopped
    profiles: [observability]

  # Host metrics. On Docker Desktop (macOS) this is the Linux VM running the containers, not macOS itself.
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Metrics written by host scripts (direct ingress: the certificate's expiry); empty otherwise.
      - --collector.textfile.directory=/textfile
    volumes:
      - ${NODE_EXPORTER_TEXTFILE_DIR:-./observability/textfile}:/textfile:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    mem_limit: 64m
    networks: [telemetry]
    restart: unless-stopped
    profiles: [observability]

  # Per-container CPU, memory, network.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      # Docker Desktop only maps the socket itself (not all of /var/run); works the same on Linux.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    mem_limit: 192m
    networks: [telemetry]
    restart: unless-stopped
    profiles: [observability]

# Edge services (api, web, edge, cloudflared) are on `default`, which reaches the internet. Telemetry lives on
# internal networks (no internet, nothing published): the api reaches only the collector (otlp), nginx only Grafana
# (grafana), and nothing internet-facing reaches Prometheus, Loki, Tempo or the privileged cadvisor.
networks:
  default:
  otlp:
    internal: true
  grafana:
    internal: true
  telemetry:
    internal: true
  # How the api and edge reach LiveKit, which runs in the host's network: its fixed gateway 172.30.0.1 is the host.
  livekit:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  api-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
