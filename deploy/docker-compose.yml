name: cipheroom

services:
  api:
    build:
      context: ..
      dockerfile: src/Cipheroom.Api/Dockerfile
    environment:
      Turn__Cloudflare__KeyId: ${CF_TURN_KEY_ID:-}
      Turn__Cloudflare__ApiToken: ${CF_TURN_API_TOKEN:-}
      Turn__CredentialTtlSeconds: ${TURN_CREDENTIAL_TTL_SECONDS:-14400}
      Turn__ForceRelay: ${TURN_FORCE_RELAY:-false}
      # Media goes through Cloudflare Realtime SFU: calls can't work without it.
      Sfu__Cloudflare__AppId: ${CF_SFU_APP_ID:?set CF_SFU_APP_ID in deploy/.env (see scripts/secrets.sh)}
      Sfu__Cloudflare__AppSecret: ${CF_SFU_APP_SECRET:?set CF_SFU_APP_SECRET in deploy/.env (see scripts/secrets.sh)}
      # Trust X-Forwarded-* from our proxies only (cloudflared → nginx → api). The api publishes no ports, so only
      # containers on the compose network (Docker's 172.16.0.0/12 range) can reach it.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped
    profiles: [tunnel]
