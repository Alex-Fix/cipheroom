# Builds the api and web images and publishes them to GitHub Container Registry, tagged by commit, for servers that
# pull instead of building (scripts/deploy.sh, docs/deployment-hetzner.md). Home use (scripts/up.sh) builds locally.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what goes into the images; scripts/deploy.sh picks the last commit that touched these.
    paths:
      - "src/**"
      - "web/**"
      - "deploy/nginx/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/Cipheroom.Api/Dockerfile
          - image: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lowercase; the repository owner may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # AGPL §13: the web image's Source link opens the exact commit it was built from (ignored by the api).
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
