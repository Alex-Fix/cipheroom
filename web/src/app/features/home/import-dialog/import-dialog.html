<nz-modal
  [nzVisible]="open()"
  nzTitle="Import a host key"
  [nzFooter]="footer"
  (nzOnCancel)="close()"
>
  <ng-container *nzModalContent>
    <form class="form" (ngSubmit)="submit()">
      <p class="lead">
        Host a meeting from this browser using the backup you saved when you created it.
      </p>
      <label for="backup-file">Backup file</label>
      <input
        id="backup-file"
        type="file"
        accept=".key,application/json"
        class="file"
        (change)="pick($event)"
      />
      <label for="backup-passphrase">Passphrase</label>
      <input
        nz-input
        id="backup-passphrase"
        name="passphrase"
        type="password"
        autocomplete="current-password"
        [ngModel]="passphrase()"
        (ngModelChange)="passphrase.set($event)"
      />
      @if (fileError() ?? error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
    </form>
  </ng-container>
  <ng-template #footer>
    <button nz-button class="cancel" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      nz-button
      nzType="primary"
      class="unlock"
      [nzLoading]="busy()"
      [disabled]="!canUnlock()"
      (click)="submit()"
    >
      <nz-icon nzType="key" /> Import
    </button>
  </ng-template>
</nz-modal>
