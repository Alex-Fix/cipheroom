<nz-modal
  [nzVisible]="open()"
  nzTitle="Import a host key"
  [nzCentered]="true"
  [nzWidth]="440"
  [nzMaskClosable]="false"
  [nzFooter]="footer"
  (nzOnCancel)="close()"
>
  <ng-container *nzModalContent>
    <form class="form" (ngSubmit)="submit()">
      <p class="lead">
        Host a meeting from this browser using the backup you saved when you created it.
      </p>
      <label for="backup-file">Backup file</label>
      <!-- Re-created on every opening, so no file from before stays picked. -->
      @for (g of [generation()]; track g) {
        <input
          id="backup-file"
          type="file"
          accept=".key,application/json"
          class="file"
          (change)="pick($event)"
        />
      }
      <label for="backup-passphrase">Passphrase</label>
      <input
        nz-input
        id="backup-passphrase"
        name="passphrase"
        type="password"
        autocomplete="current-password"
        [ngModel]="passphrase()"
        (ngModelChange)="setPassphrase($event)"
      />
      <button type="submit" hidden></button>
      @if (shownError(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
    </form>
  </ng-container>
  <ng-template #footer>
    <button nz-button class="cancel" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      nz-button
      nzType="primary"
      class="unlock"
      [nzLoading]="busy()"
      [disabled]="!canUnlock()"
      (click)="submit()"
    >
      <nz-icon nzType="key" /> Import
    </button>
  </ng-template>
</nz-modal>
