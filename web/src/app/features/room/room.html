<div class="room">
  <app-call-header
    [roomId]="roomId()"
    [link]="link"
    [status]="status()"
    [participants]="participantCount()"
    [manualCopy]="manualCopy()"
    (copyLink)="copyLink()"
    (manualCopyClosed)="manualCopy.set(false)"
    (rejoin)="retry()"
    (showParticipants)="showParticipants.set(true)"
  />

  <div class="notices" aria-live="polite">
    @for (notice of notices(); track notice.id) {
      <div class="notice glass">{{ notice.text }}</div>
    }
  </div>

  @if (error(); as message) {
    <section class="join-error" role="alert">
      <nz-icon class="join-error-icon" nzType="exclamation-circle" />
      <h2>Couldn't join the call</h2>
      <p>{{ message }}</p>
      <div class="actions">
        <button nz-button nzShape="round" nzSize="large" class="home" (click)="leave()">
          Back to Home
        </button>
        <button
          nz-button
          nzType="primary"
          nzShape="round"
          nzSize="large"
          class="retry"
          (click)="retry()"
        >
          Try Again
        </button>
      </div>
    </section>
  } @else {
    @if (!livekit.canPlaybackAudio()) {
      <div class="audio-blocked glass" role="status">
        <nz-icon nzType="sound" />
        <span>Your browser paused call audio.</span>
        <button
          nz-button
          nzType="primary"
          nzShape="round"
          nzSize="small"
          (click)="livekit.startAudio()"
        >
          Enable Audio
        </button>
      </div>
    }

    <section class="grid" [attr.data-count]="livekit.tiles().length">
      @for (tile of livekit.tiles(); track tile.key) {
        <app-call-tile [tile]="tile" />
      }
    </section>

    <app-call-controls
      class="controls"
      [micEnabled]="livekit.micEnabled()"
      [cameraEnabled]="livekit.cameraEnabled()"
      [screenShareEnabled]="livekit.screenShareEnabled()"
      [canShareScreen]="canShareScreen"
      [cameras]="livekit.cameras()"
      [activeCameraId]="livekit.activeCameraId()"
      [canFlip]="livekit.canFlip()"
      (toggleMic)="setDevice('microphone', !livekit.micEnabled())"
      (toggleCamera)="setDevice('camera', !livekit.cameraEnabled())"
      (toggleScreenShare)="setDevice('screen', !livekit.screenShareEnabled())"
      (flipCamera)="switchCamera()"
      (selectCamera)="switchCamera($event)"
      (openDiagnostics)="showDiagnostics.set(true)"
      (leave)="leave()"
    />
  }

  <app-participants-panel
    [open]="showParticipants()"
    [participants]="livekit.participants()"
    (closed)="showParticipants.set(false)"
  />

  <app-diagnostics-drawer
    [open]="showDiagnostics()"
    [diagnostics]="livekit.diagnostics()"
    (closed)="showDiagnostics.set(false)"
  />
</div>
