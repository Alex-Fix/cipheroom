<div class="room">
  <app-call-header
    [roomId]="roomId()"
    [link]="link"
    [status]="status()"
    [participants]="participantCount()"
    [safetyCode]="crypto.safetyCode()"
    [unverified]="crypto.unverified().size"
    [manualCopy]="manualCopy()"
    (copyLink)="copyLink()"
    (manualCopyClosed)="manualCopy.set(false)"
    (rejoin)="retry()"
    (showParticipants)="showParticipants.set(true)"
  />

  <div class="notices" aria-live="polite">
    @for (notice of notices(); track notice.id) {
      <div class="notice glass">{{ notice.text }}</div>
    }
  </div>

  @if (error(); as message) {
    <section class="join-error" role="alert">
      <nz-icon class="join-error-icon" nzType="exclamation-circle" />
      <h2>Couldn't join the call</h2>
      <p>{{ message }}</p>
      <div class="actions">
        <button nz-button nzShape="round" nzSize="large" class="home" (click)="leave()">
          Back to Home
        </button>
        <button
          nz-button
          nzType="primary"
          nzShape="round"
          nzSize="large"
          class="retry"
          (click)="retry()"
        >
          Try Again
        </button>
      </div>
    </section>
  } @else {
    @if (!media.canPlaybackAudio()) {
      <div class="audio-blocked glass" role="status">
        <nz-icon nzType="sound" />
        <span>Your browser paused call audio.</span>
        <button
          nz-button
          nzType="primary"
          nzShape="round"
          nzSize="small"
          (click)="media.startAudio()"
        >
          Enable Audio
        </button>
      </div>
    }

    <section class="grid" [attr.data-count]="media.tiles().length">
      @for (tile of media.tiles(); track tile.key) {
        <app-call-tile [tile]="tile" (appElementSize)="media.setTileSize(tile.key, $event)" />
      }
    </section>

    <app-call-controls
      class="controls"
      [micEnabled]="media.micEnabled()"
      [cameraEnabled]="media.cameraEnabled()"
      [screenShareEnabled]="media.screenShareEnabled()"
      [canShareScreen]="canShareScreen"
      [cameras]="media.cameras()"
      [activeCameraId]="media.activeCameraId()"
      [canFlip]="media.canFlip()"
      [qualities]="media.availableQualities()"
      [quality]="media.videoQuality()"
      (toggleMic)="setDevice('microphone', !media.micEnabled())"
      (toggleCamera)="setDevice('camera', !media.cameraEnabled())"
      (toggleScreenShare)="setDevice('screen', !media.screenShareEnabled())"
      (flipCamera)="switchCamera()"
      (selectCamera)="switchCamera($event)"
      (selectQuality)="setQuality($event)"
      (leave)="leave()"
    />
  }

  <app-participants-panel
    [open]="showParticipants()"
    [participants]="media.participants()"
    (closed)="showParticipants.set(false)"
  />
</div>
