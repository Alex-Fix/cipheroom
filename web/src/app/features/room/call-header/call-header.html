<div class="room">
  <span class="room-id" [title]="roomId()">{{ roomId() }}</span>
  <button
    type="button"
    class="icon-button glass copy"
    aria-label="Copy invite link"
    nz-tooltip
    nzTooltipTitle="Copy invite link"
    nz-popover
    [nzPopoverContent]="manualCopyTpl"
    nzPopoverTitle="Copy this link"
    [nzPopoverTrigger]="null"
    [nzPopoverVisible]="manualCopy()"
    (nzPopoverVisibleChange)="!$event && manualCopyClosed.emit()"
    nzPopoverPlacement="bottomLeft"
    (click)="copyLink.emit()"
  >
    <nz-icon nzType="copy" />
  </button>
  <ng-template #manualCopyTpl>
    <input
      nz-input
      readonly
      class="manual-copy"
      [value]="link()"
      (focus)="$any($event.target).select()"
      aria-label="Invite link"
    />
  </ng-template>
</div>

<div class="status glass">
  <span class="state" [attr.data-status]="status()">
    <span class="dot" aria-hidden="true"></span>
    <span class="state-text">{{ statusText() }}</span>
  </span>

  @if (status() === 'disconnected') {
    <button
      nz-button
      nzType="primary"
      nzShape="round"
      nzSize="small"
      class="rejoin"
      (click)="rejoin.emit()"
    >
      Rejoin
    </button>
  }

  <span class="divider" aria-hidden="true"></span>

  @if (safetyCode(); as code) {
    <button
      type="button"
      class="e2ee secure"
      [class.warn]="unverified() > 0"
      [attr.aria-label]="safetyCodeLabel()"
      nz-popover
      nzPopoverTitle="Safety code"
      [nzPopoverContent]="safetyCodeTpl"
      nzPopoverTrigger="click"
      nzPopoverPlacement="bottom"
    >
      <nz-icon [nzType]="unverified() > 0 ? 'exclamation-circle' : 'lock'" />
      <span class="label">Encrypted</span>
      <!-- Always visible, so people can compare without opening anything. -->
      <span class="code" aria-hidden="true">
        <span class="code-emoji">
          @for (e of code.emoji; track $index) {
            <span>{{ e.symbol }}</span>
          }
        </span>
        <span class="code-digits">{{ code.digits }}</span>
      </span>
    </button>
    <ng-template #safetyCodeTpl>
      <app-safety-code [code]="code" [unverified]="unverified()" />
    </ng-template>
  } @else {
    <!-- Never optimistic: no lock until our keys are in place. Media doesn't flow unencrypted meanwhile. -->
    <span class="e2ee" nz-tooltip nzTooltipTitle="Setting up end-to-end encryption">
      <nz-icon nzType="sync" /> <span class="label">Securing…</span>
    </span>
  }

  <span class="divider" aria-hidden="true"></span>

  <button
    type="button"
    class="count"
    nz-tooltip
    nzTooltipTitle="People"
    [attr.aria-label]="'Show people (' + participants() + ')'"
    (click)="showParticipants.emit()"
  >
    <nz-icon nzType="team" /> {{ participants() }}
  </button>
</div>
